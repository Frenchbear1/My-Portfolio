name: Apply site fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-site-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update portfolio
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import binascii
          import struct
          import zlib

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one {label} match, found {count}")
              return text.replace(old, new, 1)

          index = Path("index.html")
          html = index.read_text()

          old_scroll = "<script>if('scrollRestoration'in history)history.scrollRestoration='manual';const resetPageScroll=()=>{const r=document.documentElement,p=r.style.scrollBehavior;r.style.scrollBehavior='auto';scrollTo(0,0);requestAnimationFrame(()=>r.style.scrollBehavior=p)};resetPageScroll();addEventListener('pageshow',resetPageScroll)</script>"
          new_scroll = """<script>
          if('scrollRestoration'in history)history.scrollRestoration='manual';
          const pageWasReloaded=(()=>{const n=performance.getEntriesByType?.('navigation')?.[0];return n?n.type==='reload':performance.navigation?.type===1})();
          const resetPageScroll=()=>{const r=document.documentElement,p=r.style.scrollBehavior;r.style.scrollBehavior='auto';scrollTo({top:0,left:0,behavior:'auto'});requestAnimationFrame(()=>r.style.scrollBehavior=p)};
          if(pageWasReloaded){
            if(location.hash)history.replaceState(null,'',location.pathname+location.search);
            resetPageScroll();
            addEventListener('DOMContentLoaded',resetPageScroll,{once:true});
            addEventListener('load',()=>{resetPageScroll();requestAnimationFrame(resetPageScroll)},{once:true});
          }
          addEventListener('pageshow',e=>{if(pageWasReloaded||e.persisted)resetPageScroll()});
          </script>"""
          html = replace_once(html, old_scroll, new_scroll, "refresh script")

          old_icons = """<link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
          <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
          <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">"""
          new_icons = """<link rel="icon" type="image/svg+xml" href="assets/icons/icon-full.svg">
          <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-browser-32.png">
          <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon-full.png">"""
          html = replace_once(html, old_icons, new_icons, "icon links")

          old_mindset = '<div class="glass rv"><h3 style="margin-bottom:12px">Mindset</h3><p>To operate with the mindset, discipline, and skill required for excellence in aviation, backed by a 4.0 GPA and a perfect 100% on the FAA Commercial Knowledge Exam. That means preparing thoroughly, communicating clearly, and holding the same high standard on the ground and in the air.</p></div>'
          new_mindset = '<div class="glass rv"><h3 style="margin-bottom:12px">Mindset</h3><p>My aeronautics studies and FAA commercial knowledge preparation gave me a strong foundation, but aviation keeps me learning. I aim to bring disciplined preparation, clear communication, and steady judgment to every flight.</p></div>'
          html = replace_once(html, old_mindset, new_mindset, "mindset copy")

          old_teaching = '<div class="glass rv"><h3 style="margin-bottom:12px">Teaching</h3><p>As an aeronautics tutor I explain complex ACS knowledge concepts using real-world examples and analogies, and I adapt to how each student learns so everyone understands the material.</p><p>Teamwork and leadership grew through the National Intercollegiate Flying Association, a safe but competitive environment.</p></div></div>'
          new_teaching = '<div class="glass rv"><h3 style="margin-bottom:12px">Teaching</h3><p>As an aeronautics tutor, I worked with students on ACS knowledge areas using practical examples and adapting explanations to the way each student learned best.</p><p>NIFA also gave me experience working with others in a safety-focused, competitive environment.</p></div></div>'
          html = replace_once(html, old_teaching, new_teaching, "teaching copy")
          index.write_text(html)

          old_svg = Path("assets/icons/icon.svg")
          svg = replace_once(old_svg.read_text(), '<rect width="512" height="512" rx="112" fill="url(#bg)"/>', '<rect width="512" height="512" fill="url(#bg)"/>', "icon background")
          Path("assets/icons/icon-full.svg").write_text(svg)
          old_svg.unlink()

          def paeth(a, b, c):
              p = a + b - c
              pa, pb, pc = abs(p - a), abs(p - b), abs(p - c)
              return a if pa <= pb and pa <= pc else b if pb <= pc else c

          def opaque_png(source, destination, background=(11, 26, 58)):
              data = Path(source).read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f"Not a PNG: {source}")
              pos, ihdr, compressed = 8, None, bytearray()
              while pos < len(data):
                  length = struct.unpack('>I', data[pos:pos + 4])[0]
                  kind = data[pos + 4:pos + 8]
                  chunk = data[pos + 8:pos + 8 + length]
                  pos += 12 + length
                  if kind == b'IHDR':
                      ihdr = chunk
                  elif kind == b'IDAT':
                      compressed.extend(chunk)
                  elif kind == b'IEND':
                      break
              width, height, depth, color, compression, filtering, interlace = struct.unpack('>IIBBBBB', ihdr)
              if (depth, color, compression, filtering, interlace) != (8, 6, 0, 0, 0):
                  raise SystemExit(f"Unexpected PNG format for {source}")
              packed = zlib.decompress(bytes(compressed))
              stride, bpp, offset, rows = width * 4, 4, 0, []
              prior = bytearray(stride)
              for _ in range(height):
                  filter_type = packed[offset]
                  offset += 1
                  scan = bytearray(packed[offset:offset + stride])
                  offset += stride
                  for x in range(stride):
                      left = scan[x - bpp] if x >= bpp else 0
                      up = prior[x]
                      upper_left = prior[x - bpp] if x >= bpp else 0
                      if filter_type == 1:
                          scan[x] = (scan[x] + left) & 255
                      elif filter_type == 2:
                          scan[x] = (scan[x] + up) & 255
                      elif filter_type == 3:
                          scan[x] = (scan[x] + ((left + up) // 2)) & 255
                      elif filter_type == 4:
                          scan[x] = (scan[x] + paeth(left, up, upper_left)) & 255
                      elif filter_type != 0:
                          raise SystemExit(f"Unexpected PNG filter {filter_type}")
                  for x in range(0, stride, 4):
                      alpha = scan[x + 3]
                      for channel, bg in enumerate(background):
                          scan[x + channel] = (scan[x + channel] * alpha + bg * (255 - alpha) + 127) // 255
                      scan[x + 3] = 255
                  rows.append(b'\x00' + bytes(scan))
                  prior = scan

              def chunk(kind, payload):
                  return struct.pack('>I', len(payload)) + kind + payload + struct.pack('>I', binascii.crc32(kind + payload) & 0xffffffff)

              output = data[:8] + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(b''.join(rows), 9)) + chunk(b'IEND', b'')
              Path(destination).write_bytes(output)
              Path(source).unlink()

          opaque_png("assets/icons/favicon-32.png", "assets/icons/favicon-browser-32.png")
          opaque_png("assets/icons/apple-touch-icon.png", "assets/icons/apple-touch-icon-full.png")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-site-fixes.yml
          git add -A
          git commit -m "Fix refresh position and browser icon"
          git push origin main
