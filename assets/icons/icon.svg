<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">David LaBarre aviation mark</title>
  <desc id="desc">A gold airplane crossing a blue horizon on a deep navy background.</desc>
  <defs>
    <linearGradient id="bg" x1="96" y1="38" x2="416" y2="474" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142E63"/>
      <stop offset="1" stop-color="#071126"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#78C4FF"/>
      <stop offset="1" stop-color="#347FCE"/>
    </linearGradient>
    <linearGradient id="gold" x1="142" y1="152" x2="386" y2="355" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE28A"/>
      <stop offset=".48" stop-color="#FFC857"/>
      <stop offset="1" stop-color="#E89B25"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#020916" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="177" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="3"/>
  <path d="M76 301C149 253 229 236 318 246c47 5 86 18 118 39" fill="none" stroke="url(#sky)" stroke-width="15" stroke-linecap="round" opacity=".85"/>
  <path d="M78 328c103-51 231-59 356-10" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".15"/>
  <g filter="url(#shadow)" transform="translate(256 250) rotate(-18) translate(-256 -250)">
    <path d="M93 259l31-15 91-7 73-118h31l-39 116 80 5 28-45h23l-15 59 15 59h-23l-28-45-80 5 39 116h-31l-73-118-91-7-31-15z" fill="url(#gold)"/>
    <path d="M124 244l91-7 65-105" fill="none" stroke="#FFF4CA" stroke-width="6" stroke-linecap="round" opacity=".62"/>
  </g>
  <circle cx="405" cy="106" r="8" fill="#FFC857"/>
</svg>
